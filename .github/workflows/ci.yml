name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m py_compile bin/review-atlas scripts/package_skill.py tests/test_cli.py tests/test_content.py tests/test_package.py
      - name: Build account upload package
        run: ./bin/review-atlas package
      - name: Inspect account upload package
        run: python -m zipfile --list dist/review-atlas.skill
